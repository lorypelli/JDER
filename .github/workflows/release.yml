name: Release

on:
    push:
        branches: [main]
    workflow_dispatch:

concurrency:
    group: release
    cancel-in-progress: false

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-java@v6
              with:
                  distribution: temurin
                  java-version: 21
            - uses: gradle/actions/setup-gradle@v6
            - run: ./gradlew jvmJar --no-build-cache
            - run: gh release upload JDER build/libs/JDER.jar --clobber
              env:
                  GH_TOKEN: ${{ github.token }}
